name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - uses: actions/setup-node@v7
      with:
        node-version: '24.x'
    
    - run: npm ci
    
    - run: npm run lint
    
    - run: npm run type-check
    
    - run: npm run db:generate
    
    - run: npm test
    
    - run: npm run build
